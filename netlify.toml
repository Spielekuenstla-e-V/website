[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

## This rule redirects to an external API, signing requests with a secret
[[redirects]]
  from = "/dieliste"
  to = "https://docs.google.com/spreadsheets/d/1OVWClUuYn7EL9XNTiJja63HpRUyyWvQXtlYn02ywmK8"
  status = 200
  force = true # COMMENT: ensure that we always redirect
[[redirects]]
  from = "/brettspielwochenende"
  to = "/20261023_brettspielwochenende"

## SPA fallback: let the Ember (history) router handle client-side routes.
## NOTE: prember/empress static prerendering was removed during the Vite
## migration, so every route is now served from the SPA shell until static
## generation is reimplemented as a Vite plugin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
